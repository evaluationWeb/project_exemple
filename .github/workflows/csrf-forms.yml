name: Verify Web session and CSRF

on:
  push:
    branches: [variant/web-session-csrf]
  pull_request:
    paths:
      - 'src/Controller/**'
      - 'src/Security/**'
      - 'src/Middleware/**'
      - 'template/template_register.php'
      - 'tests/csrf_token_manager_test.php'
      - 'tests/csrf_middleware_test.php'
      - 'tests/jwt_authentication_test.php'
      - 'tests/jwt_api_routes_test.php'
      - 'tests/csrf_route_configuration_test.php'
      - 'public/index.php'
      - 'tests/form_submission_test.php'
      - 'tests/auth_form_render_test.php'
      - 'tests/request_dto_mapping_test.php'
      - 'composer.json'
      - 'config/service.php'
      - '.github/workflows/csrf-forms.yml'
  workflow_dispatch:

jobs:
  csrf-forms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Check PHP syntax
        run: |
          php -l src/Middleware/CsrfMiddleware.php
          php -l src/Middleware/InvalidCsrfTokenException.php
          php -l src/Middleware/ContainerMiddlewareResolver.php
          php -l public/index.php
          php -l tests/csrf_middleware_test.php
          php -l tests/csrf_route_configuration_test.php
          php -l src/Controller/AbstractController.php
          php -l src/Security/CsrfTokenManager.php
          php -l src/Controller/LoginController.php
          php -l src/Controller/RegisterController.php
          php -l template/template_register.php
          php -l tests/csrf_token_manager_test.php
          php -l tests/form_submission_test.php
          php -l tests/auth_form_render_test.php
          php -l tests/request_dto_mapping_test.php
      - name: Run focused tests
        run: |
          php tests/csrf_token_manager_test.php
          php tests/csrf_middleware_test.php
          php tests/csrf_route_configuration_test.php
          php tests/form_submission_test.php
          php tests/auth_form_render_test.php
          php tests/request_dto_mapping_test.php
