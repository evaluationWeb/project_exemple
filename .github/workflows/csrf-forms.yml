name: Verify stateless JWT API

on:
  push:
    branches: [variant/api-jwt]
  pull_request:
    paths: ['src/**', 'tests/**', 'public/**', 'config/**', 'composer.json', '.github/workflows/csrf-forms.yml']
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: PHP syntax check
        run: find src public config tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run API tests
        run: |
          for test in tests/*_test.php; do php "$test"; done
